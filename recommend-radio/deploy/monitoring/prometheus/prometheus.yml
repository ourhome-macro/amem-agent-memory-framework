global:
  scrape_interval: 15s
rule_files:
  - /etc/prometheus/rules/*.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]
scrape_configs:
  - job_name: radio
    metrics_path: /internal/metrics
    authorization:
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: [backend:5000]
